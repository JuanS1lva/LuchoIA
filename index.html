<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lucho IA - Experiencia táctil</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      body {
        background: #030b1e;
        overflow: hidden;
      }

      #app {
        position: relative;
        height: 100dvh;
        min-height: 100vh;
        width: 100vw;
        background-image: url("https://media.giphy.com/media/3o7aD2saalBwwftBIY/giphy.gif");
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(1, 6, 20, 0.2) 0%,
          rgba(1, 6, 20, 0.55) 100%
        );
      }

      .hotspot {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        border: 2px solid rgba(255, 255, 255, 0.6);
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.35);
        color: #ffffff;
        font-weight: 600;
        text-align: center;
        padding: 10px 12px;
        width: 38vw;
        height: 12vh;
        max-width: 200px;
        min-width: 140px;
        min-height: 60px;
        backdrop-filter: blur(6px);
        transition: transform 0.2s ease, background 0.2s ease;
        touch-action: manipulation;
      }

      .hotspot:active {
        transform: scale(0.96);
        background: rgba(255, 255, 255, 0.15);
      }

      .label {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.85);
        font-size: 14px;
        text-align: center;
        padding: 8px 16px;
        background: rgba(0, 0, 0, 0.4);
        border-radius: 999px;
        letter-spacing: 0.4px;
      }

      @media (min-width: 768px) {
        .hotspot {
          width: 22vw;
          height: 10vh;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="overlay"></div>
      <a
        v-for="spot in hotspots"
        :key="spot.id"
        class="hotspot"
        :href="spot.href"
        target="_blank"
        rel="noopener noreferrer"
        :style="spot.style"
        :aria-label="spot.label"
      >
        {{ spot.label }}
      </a>
      <div class="label">Toca las zonas luminosas para abrir enlaces</div>
    </div>

    <script>
      const { createApp } = Vue;

      createApp({
        data() {
          return {
            hotspots: [
              {
                id: "video",
                label: "Video",
                href: "https://www.youtube.com/watch?v=dQw4w9WgXcQ",
                style: {
                  top: "18%",
                  left: "10%",
                },
              },
              {
                id: "chat",
                label: "Chat en video",
                href: "https://meet.jit.si/LuchoIA-demo",
                style: {
                  top: "45%",
                  right: "8%",
                },
              },
              {
                id: "mapa",
                label: "Mapa",
                href: "https://www.google.com/maps/place/Bogota",
                style: {
                  bottom: "22%",
                  left: "20%",
                },
              },
            ],
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
